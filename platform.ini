[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mathertel/OneButton@^2.6.1
build_flags =
    -DLED1_PIN=4     ; LED ngoài (test board) - SỬA theo chân thực tế
    -DLED2_PIN=2     ; LED built-in trên devboard
    -DBTN_PIN=5
    -DLED_ACT=HIGH   ; mức logic làm LED sáng
    -DBTN_ACT=LOW    ; mức logic khi nút được nhấn